name: Basic Hello World

# Triggers the workflow on push events for any branch
on: [push]

jobs:
  say-hello:
    # Specifies the runner operating system
    runs-on: ubuntu-latest

    steps:
      # Step 1: Print a basic text string
      - name: Run a one-line script
        run: echo "Hello from GitHub Actions!"

      # Step 2: Print predefined environment variables
      - name: Show multi-line environment info
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch ref: ${{ github.ref }}"
